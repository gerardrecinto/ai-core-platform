apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-core-gateway
  {{- if .Values.serviceAccount.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-core-gateway
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: ai-core-gateway }
  template:
    metadata:
      labels: { app: ai-core-gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: ai-core-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{ containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 10 }
          resources: {{ toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-core-gateway
spec:
  selector: { app: ai-core-gateway }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-core-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: ai-core-gateway }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-core-gateway
spec:
  podSelector:
    matchLabels: { app: ai-core-gateway }
  policyTypes: [Ingress]
  ingress:
    - from: [{ ipBlock: { cidr: {{ .Values.ingressCidr | quote }} } }]
      ports: [{ port: 8080 }]
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-core-gateway
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ai-core-gateway }
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPU }} } }
{{- end }}
